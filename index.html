<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080809">
<title>MAYDAY ICONIC 2026 | Odliczamy do Spodka</title>
<meta name="description" content="Nasza ekipa odlicza do MAYDAY ICONIC. Katowice, Spodek, 10 listopada 2026 o 17:00. Do zobaczenia pod sceną!">
<meta property="og:type" content="website"><meta property="og:title" content="MAYDAY ICONIC 2026 | Odliczamy do Spodka">
<meta property="og:description" content="10.11.2026 • 17:00 • Katowice, Spodek. Odpal licznik i szykuj się na wspólną noc!">
<meta property="og:image" content="./social.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<style>
:root{color-scheme:dark;--red:#ff343b;--dim:#929297}*{box-sizing:border-box}body{margin:0;background:#080809;color:#f5f3ee;font-family:Arial,Helvetica,sans-serif;min-height:100svh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,#a5101825,transparent 60%),repeating-linear-gradient(0deg,transparent 0 3px,#ffffff03 3px 4px)}.beam{position:fixed;top:-30%;left:50%;height:150vh;width:1px;background:linear-gradient(transparent,#ff343b70,transparent);box-shadow:0 0 20px #ff343b;transform:rotate(36deg);pointer-events:none}.beam.b{transform:rotate(-36deg)}main{position:relative;max-width:1180px;margin:auto;padding:30px 32px 22px;min-height:100svh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:15px;font-size:11px;letter-spacing:2px;color:#b2afb0}.live{display:flex;align-items:center;gap:9px}.dot{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 12px var(--red)}.hero{text-align:center;margin:auto 0;padding:55px 0 40px}.eyebrow{color:var(--red);letter-spacing:6px;font-size:11px;font-weight:bold}h1{font-size:clamp(70px,15vw,180px);letter-spacing:-.07em;line-height:.9;margin:30px 0 0;font-weight:900;text-shadow:0 0 70px #ff343b22}.edition{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:14px;letter-spacing:10px;font-size:clamp(20px,4vw,40px);font-weight:bold}.year{font-size:12px;letter-spacing:3px;color:var(--red);border:1px solid #ff343b60;padding:8px 10px}.rule{height:1px;background:linear-gradient(90deg,transparent,#ff343b70,transparent);margin:35px auto 25px;max-width:720px}.status{font-size:11px;letter-spacing:3px;color:var(--dim);margin-bottom:20px}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:800px;margin:auto}.unit{position:relative;background:linear-gradient(145deg,#1b1012aa,#0e0d0faa);border:1px solid #ffffff14;border-top:1px solid #ff343b70;border-radius:3px;padding:22px 4px 17px}.number{display:block;font-family:Arial,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-3px;font-size:clamp(38px,7.5vw,84px);line-height:1.1}.unit:last-child .number{color:var(--red);text-shadow:0 0 25px #ff343b45;animation:breathe 2s ease-in-out infinite}.label{display:block;font-size:9px;letter-spacing:3px;color:var(--dim);margin-top:12px}.date{font-size:14px;margin:25px 0 0;letter-spacing:2px}.zone{color:var(--dim);font-size:11px;margin:9px 0 28px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button,a.button{font:700 11px Arial;letter-spacing:1px;padding:15px 22px;border:1px solid #ffffff22;border-radius:3px;cursor:pointer;text-decoration:none;color:white;background:#ffffff06}button.primary{background:var(--red);color:#080809;border-color:var(--red)}button:hover,a.button:hover{filter:brightness(1.2)}:focus-visible{outline:2px solid white;outline-offset:4px}.feedback{min-height:17px;font-size:12px;color:#bcb9ba;margin-top:12px}footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid #ffffff12;padding-top:18px;color:#68676c;font-size:9px;letter-spacing:1px}.slogan{color:#aaa6a8}.motion{position:absolute;right:0;bottom:0;color:#817b7d;background:transparent;border:0;font-size:9px;padding:0;position:static}body.still .number{animation:none}@keyframes breathe{50%{text-shadow:0 0 40px #ff343b90}}@media(max-width:550px){main{padding:22px 18px}header{font-size:9px;letter-spacing:1px}.hero{padding:50px 0 25px}.eyebrow{letter-spacing:4px;font-size:9px}h1{margin-top:25px}.edition{letter-spacing:7px;gap:12px}.year{font-size:10px}.clock{gap:6px}.unit{padding:20px 2px 14px}.number{letter-spacing:-2px}.label{letter-spacing:1px;font-size:8px}.date{font-size:11px;letter-spacing:1px}footer{flex-wrap:wrap;font-size:8px}.status{font-size:9px;letter-spacing:2px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
</head>
<body><div class="beam"></div><div class="beam b"></div><main>
<header><span>KATOWICE / SPODEK</span><span class="live"><span class="dot"></span> NASZA NOC. NASZA EKIPA.</span></header>
<section class="hero" aria-label="Odliczanie do MAYDAY">
<div class="eyebrow">THE COUNTDOWN HAS BEGUN</div><h1>MAYDAY</h1><div class="edition">ICONIC <span class="year">2026</span></div><div class="rule"></div>
<div id="status" class="status">DO SPOTKANIA POD SCENĄ</div>
<div class="clock" role="timer" aria-label="Czas pozostały do rozpoczęcia" aria-live="off">
<div class="unit"><span id="days" class="number">00</span><span class="label">DNI</span></div>
<div class="unit"><span id="hours" class="number">00</span><span class="label">GODZIN</span></div>
<div class="unit"><span id="minutes" class="number">00</span><span class="label">MINUT</span></div>
<div class="unit"><span id="seconds" class="number">00</span><span class="label">SEKUND</span></div></div>
<p class="date">10 LISTOPADA 2026 · GODZ. 17:00</p><p class="zone">Katowice, Spodek · czas polski</p>
<div class="actions"><button class="primary" id="share">WYŚLIJ EKIPIE</button><a class="button" href="https://mayday.pl/" target="_blank" rel="noopener noreferrer">STRONA WYDARZENIA ↗</a></div>
<div class="feedback" id="feedback" role="status"></div><noscript>Włącz JavaScript, aby zobaczyć odliczanie.</noscript>
</section><footer><span class="slogan">FORWARD EVER, BACKWARD NEVER</span><span>LICZNIK FANOWSKI</span><button class="motion" id="motion" aria-pressed="false">WYŁĄCZ PULSOWANIE</button></footer></main>
<script>
const target=Date.parse('2026-11-10T17:00:00+01:00');
function remaining(now){const t=Math.max(0,Math.ceil((target-now)/1000));return [Math.floor(t/86400),Math.floor(t/3600)%24,Math.floor(t/60)%60,t%60]}
function tick(){const now=Date.now();remaining(now).forEach((n,i)=>document.getElementById(['days','hours','minutes','seconds'][i]).textContent=String(n).padStart(2,'0'));if(now>=target)document.getElementById('status').textContent='CZAS STARTU MINĄŁ. WIDZIMY SIĘ W SPODKU!'}
tick();setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
document.getElementById('share').addEventListener('click',async()=>{const feedback=document.getElementById('feedback');if(location.protocol==='file:'){feedback.textContent='Udostępnianie linku będzie działać po publikacji strony.';return}const url=location.href.split('#')[0];const text='Odliczamy do MAYDAY ICONIC 2026! Katowice, Spodek, 10 listopada o 17:00.';if(navigator.share){try{await navigator.share({title:document.title,text,url});return}catch(e){if(e.name==='AbortError')return}}window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank','noopener,noreferrer')});
document.getElementById('motion').addEventListener('click',e=>{const off=document.body.classList.toggle('still');e.target.setAttribute('aria-pressed',String(off));e.target.textContent=off?'WŁĄCZ PULSOWANIE':'WYŁĄCZ PULSOWANIE'});
</script></body></html>
